name: Build, Lint, Test
description: Builds, lints, and tests the project with optional coverage reporting.

inputs:
  build_script:
    description: 'Command to run for building.'
    required: false
    default: "pnpm build"
  lint_script:
    description: 'Command to run for linting.'
    required: false
    default: "pnpm lint"
  test_script:
    description: 'Command to run for testing.'
    required: false
    default: "pnpm test"
  server_script:
    description: 'Command that starts a server the tests need. Skipped when empty.'
    required: false
    default: ""
  # https://github.com/nuxt/nuxt/issues/29771
  server_health_url:
    description: 'Full URL polled until the server answers, e.g. http://localhost:3000/.'
    required: false
    default: ""
  # https://github.com/nuxt/nuxt/issues/29771
  server_ready_url:
    description: 'Second URL polled after the health URL, e.g. the homepage, to confirm the front layer finished building.'
    required: false
    default: ""
  set_self_signed_cert:
    description: 'Set to "true" to generate a throwaway localhost cert before the server starts, exported as LOCALHOST_KEY_PEM and LOCALHOST_PEM.'
    required: false
    default: "false"
  report_coverage:
    description: 'Set to "false" to skip coverage report posting on PRs.'
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Generate self-signed cert
      if: ${{ inputs.set_self_signed_cert == 'true' }}
      run: |
        printf '%s\n' '[req]' 'distinguished_name = dn' 'prompt = no' '[dn]' 'CN = localhost' '[v3_req]' 'subjectAltName = @alt_names' '[alt_names]' 'DNS.1 = localhost' 'IP.1 = 127.0.0.1' > /tmp/localhost-cert.conf
        openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/localhost-key.pem -out /tmp/localhost-cert.pem -days 2 -config /tmp/localhost-cert.conf -extensions v3_req
        echo "LOCALHOST_KEY_PEM=/tmp/localhost-key.pem" >> "$GITHUB_ENV"
        echo "LOCALHOST_PEM=/tmp/localhost-cert.pem" >> "$GITHUB_ENV"
      shell: bash

    - run: ${{ inputs.build_script }}
      shell: bash

    - run: ${{ inputs.lint_script }}
      shell: bash

    - name: Start server
      if: ${{ inputs.server_script != '' }}
      run: ${{ inputs.server_script }} > /tmp/server.log 2>&1 &
      shell: bash

    - name: Wait for server
      if: ${{ inputs.server_script != '' }}
      run: |
        curl --retry 60 --retry-delay 5 --retry-all-errors --insecure -sf ${{ inputs.server_health_url }} > /dev/null
        if [ -n "${{ inputs.server_ready_url }}" ]; then
          curl --retry 60 --retry-delay 5 --retry-all-errors --insecure -sf ${{ inputs.server_ready_url }} > /dev/null
        fi
      shell: bash

    - run: ${{ inputs.test_script }}
      shell: bash

    - name: Stop server
      if: ${{ always() && inputs.server_script != '' }}
      run: pkill -f "$TEST_SERVER_PATTERN" || true
      shell: bash
      env:
        TEST_SERVER_PATTERN: ${{ inputs.server_script }}

    - name: Dump server log
      if: ${{ failure() && inputs.server_script != '' }}
      run: tail -n 100 /tmp/server.log
      shell: bash

    - name: Coverage
      if: ${{ github.event_name == 'pull_request' && inputs.report_coverage == 'true' }}
      uses: romeovs/lcov-reporter-action@v0.3.1
