name: NPM Release
description: Publishes to npm via semantic-release with OIDC, or runs a dry run.

inputs:
  ENABLE_RELEASE:
    description: 'Set to "true" to publish; otherwise runs a dry run.'
    required: true
  release_script:
    description: 'Command to run for releasing.'
    required: false
    default: "pnpm semantic-release"
  dry_run_script:
    description: 'Command to run for a dry run.'
    required: false
    default: "pnpm semantic-release --dry-run"

runs:
  using: "composite"
  steps:
    - name: Release
      if: "inputs.ENABLE_RELEASE == 'true' && ! contains('refs/heads/build ', github.ref)"
      env:
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
      run: ${{ inputs.release_script }}
      shell: bash

    - name: Release Dry Run
      if: "inputs.ENABLE_RELEASE != 'true' || contains('refs/heads/build ', github.ref)"
      env:
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
      run: ${{ inputs.dry_run_script }}
      shell: bash

    - name: Fail if no release
      if: "inputs.ENABLE_RELEASE != 'true' || contains('refs/heads/build ', github.ref)"
      shell: bash
      run: echo "ENABLE_RELEASE is ${{ inputs.ENABLE_RELEASE == 'true' }} and branch is ${{ github.ref }}, no release can be published." && exit 1
