name: Setup Node.js and pnpm
description: Installs Node.js, pnpm, and project dependencies with optional caching and Playwright.

inputs:
  USE_LOCKFILE:
    description: 'Set to "true" to use --frozen-lockfile, otherwise installs without lockfile.'
    required: true
  INSTALL_PLAYWRIGHT:
    description: 'Set to "true" to install Playwright browsers with caching.'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v6
      name: Setting up node.js (${{ matrix.node-version }})
      with:
        node-version: ${{ matrix.node-version }}
        cache: ${{ inputs.USE_LOCKFILE == 'true' && 'pnpm' || '' }}

    - run: pnpm install --frozen-lockfile
      name: Installing Dependencies (locked)
      if: "inputs.USE_LOCKFILE == 'true'"
      shell: bash

    - run: pnpm install --no-lockfile
      name: Installing Dependencies (no lockfile)
      if: "inputs.USE_LOCKFILE != 'true'"
      shell: bash

    - name: Get Playwright version
      if: "inputs.INSTALL_PLAYWRIGHT == 'true'"
      id: playwright-version
      shell: bash
      run: echo "version=$(node -p \"require('playwright-core/package.json').version\")" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      if: "inputs.INSTALL_PLAYWRIGHT == 'true'"
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-browsers-${{ steps.playwright-version.outputs.version }}
        restore-keys: |
          playwright-browsers-

    - name: Install Playwright Browsers
      if: "inputs.INSTALL_PLAYWRIGHT == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'"
      shell: bash
      run: npx playwright install --with-deps
