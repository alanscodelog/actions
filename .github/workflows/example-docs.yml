# Example docs workflow — copy to your repo's .github/workflows/docs.yml
# and adjust as needed.

name: Docs

env:
  USE_LOCKFILE: ${{ secrets.USE_LOCKFILE }}
  ENABLE_DOCS: ${{ secrets.ENABLE_DOCS }}

on:
  push:
    branches: [ master ]
  repository_dispatch:
    types: [ docs ]

jobs:
  docs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["lts/*"]
    steps:
      - uses: actions/checkout@v6
        if: "env.ENABLE_DOCS == 'true'"

      - name: Setup
        uses: alanscodelog/actions/.github/actions/setup-node-pnpm@main
        if: "env.ENABLE_DOCS == 'true'"
        with:
          USE_LOCKFILE: ${{ env.USE_LOCKFILE }}

      - name: Build
        uses: alanscodelog/actions/.github/actions/build-lint-test@main
        if: "env.ENABLE_DOCS == 'true'"

      - name: Deploy Docs
        uses: alanscodelog/actions/.github/actions/deploy-docs@main
        if: "env.ENABLE_DOCS == 'true'"
        with:
          doc_script: "pnpm doc"
          build_dir: "docs"
          target_branch: "gh-pages"
          # Set to "true" if your package has a playground to copy as demo
          build_playground: "false"
          # Set to "true" if your package has a demo/ directory to build
          build_demo: "false"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
