# Copy to your repo's .github/workflows/release.yml

name: Release

env:
  USE_LOCKFILE: ${{ vars.USE_LOCKFILE }}
  ENABLE_RELEASE: ${{ vars.ENABLE_RELEASE }}

on:
  push:
    branches: [ master, alpha, beta, build ]
  repository_dispatch:
    types: [ release ]

permissions:
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["lts/*"]
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup
        uses: alanscodelog/actions/.github/actions/setup@main
        with:
          USE_LOCKFILE: ${{ env.USE_LOCKFILE }}
          # Uncomment if your package uses Playwright:
          # INSTALL_PLAYWRIGHT: true

      - name: Build
        uses: alanscodelog/actions/.github/actions/build@main

      - name: Release
        uses: alanscodelog/actions/.github/actions/release@main
        with:
          ENABLE_RELEASE: ${{ env.ENABLE_RELEASE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
